name: Docker Publish

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  janus:
    name: Janus (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [mysql, pgsql, sqlite]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image namespace
        shell: bash
        run: echo "IMAGE_NAMESPACE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Janus
        uses: docker/build-push-action@v6
        with:
          context: ./janus
          file: ./janus/Dockerfile
          build-args: |
            BRANCH=${{ matrix.variant }}
          tags: ${{ env.IMAGE_NAMESPACE }}/janus:${{ matrix.variant }}
          push: true

  blessing-skin-server:
    name: Blessing Skin Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set image namespace
        shell: bash
        run: echo "IMAGE_NAMESPACE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      # The Docker driver lets the second build resolve the local builder image.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Blessing Skin builder
        uses: docker/build-push-action@v6
        with:
          context: ./blessing-skin-server
          file: ./blessing-skin-server/Dockerfile
          target: builder
          tags: blessing-skin-server:builder
          load: true

      - name: Build and push Blessing Skin
        uses: docker/build-push-action@v6
        with:
          context: ./skin
          file: ./skin/Dockerfile
          tags: ${{ env.IMAGE_NAMESPACE }}/blessing-skin:latest
          push: true
